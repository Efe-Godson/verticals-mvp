<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0070F3" />

    <!-- Android/Chrome installability -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS "Add to Home Screen" standalone behavior -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Verticals" />

    <!-- Generic fallback only - every routed page (public marketing pages,
         and the noindex auth pages) now supplies its own <title>/
         description/canonical/OG/Twitter via src/seo/SEO.jsx, which React
         19 renders as real tags once it mounts. A static canonical/OG/
         Twitter block here would sit *alongside* those (React doesn't
         remove markup it didn't render), producing duplicate/conflicting
         tags - e.g. every page's canonical would coexist with a second one
         permanently pointing at "/". So this fallback stays deliberately
         minimal: just a sensible default title/description for the
         authenticated app pages that don't render their own <SEO> (out of
         scope here - only the public marketing surface got one), and for
         the brief instant before JS mounts. See scripts/prerender.mjs for
         how the public marketing pages' static HTML gets its own complete,
         non-duplicated head instead of this fallback. -->
    <title>Verticals | Capture, Manage &amp; Understand Your Data</title>
    <meta name="description" content="Collect records, manage workflows and turn your data into clear reports and insights with Verticals." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
